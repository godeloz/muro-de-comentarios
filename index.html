<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liderazgo en Escena · Muro de comentarios</title>
<meta name="description" content="¿Cómo viviste esta experiencia con el cine?">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
:root{
  --papel:#F7F3EC;
  --papel-hondo:#EFE8DC;
  --tarjeta:#FFFDF9;
  --tinta:#2C2A26;
  --tinta-suave:#6B655C;
  --linea:#DDD4C5;
  --oro:#E9A81C;
  --oro-apagado:#DCD3C4;
  --sombra:0 1px 2px rgba(44,42,38,.05), 0 8px 24px rgba(44,42,38,.06);
  --radio:14px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit;font-size:1rem;cursor:pointer}

.envoltura{max-width:1120px;margin:0 auto;padding:0 20px 60px}

/* ---------- Encabezado ---------- */
.encabezado{padding:48px 0 28px;text-align:center}
.marca{
  font-family:"Bebas Neue",sans-serif;font-size:1.1rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--tinta-suave);margin:0 0 14px;
}
.pregunta{
  font-family:"Playfair Display",Georgia,serif;font-weight:600;
  font-size:clamp(1.8rem,5.2vw,3.1rem);line-height:1.15;margin:0 auto 18px;max-width:22ch;
}
.entradilla{
  max-width:60ch;margin:0 auto;color:var(--tinta-suave);font-size:1.02rem;
}

.ciclo-actual{
  margin:32px auto 0;max-width:820px;padding:22px 22px 18px;
  background:var(--papel-hondo);border:1px solid var(--linea);border-radius:var(--radio);
  text-align:left;
}
.ciclo-etiqueta,.divisor-etiqueta{
  font-family:"Bebas Neue",sans-serif;letter-spacing:.2em;text-transform:uppercase;
  font-size:.92rem;color:var(--tinta-suave);margin:0 0 4px;
}
.ciclo-nombre,.divisor-nombre{
  font-family:"Playfair Display",Georgia,serif;font-weight:600;
  font-size:1.5rem;margin:0 0 4px;line-height:1.2;
}
.ciclo-fechas,.divisor-fechas{margin:0;color:var(--tinta-suave);font-size:.95rem}
.ciclo-desc,.divisor-desc{margin:6px 0 0;color:var(--tinta-suave);font-size:.95rem}

.resumen-general{margin:26px 0 0}

/* ---------- Tira de películas ---------- */
.tira{
  display:flex;gap:16px;margin-top:16px;padding-bottom:6px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
}
.pelicula{width:104px;flex:0 0 auto}
.caratula{
  display:block;width:104px;height:150px;border-radius:8px;overflow:hidden;
  border:1px solid var(--linea);background:var(--tarjeta);
}
.caratula img{width:100%;height:100%;object-fit:cover;display:block}
.caratula-vacia{
  display:flex;align-items:center;justify-content:center;height:100%;padding:8px;
  font-family:"Playfair Display",Georgia,serif;font-size:.82rem;text-align:center;line-height:1.25;
}
.pelicula-titulo{margin:8px 0 0;font-size:.85rem;font-weight:500;line-height:1.25}
.pelicula-titulo a{text-decoration:none;border-bottom:1px solid var(--linea)}
.pelicula-titulo a:hover{border-color:var(--tinta)}
.pelicula-ficha{margin:2px 0 0;font-size:.78rem;color:var(--tinta-suave)}

/* ---------- Estrellas ---------- */
.estrellas{display:inline-flex;gap:2px;vertical-align:middle}
.estrella{fill:var(--oro-apagado)}
.estrella.activa{fill:var(--oro)}
.selector-estrellas{display:flex;gap:4px}
.boton-estrella{
  background:none;border:0;padding:5px;min-width:44px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
}
.boton-estrella:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}

.nota{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem}
.nota strong{font-size:1.05rem}
.nota-votos{color:var(--tinta-suave)}
.nota-sin{color:var(--tinta-suave);font-style:italic}

/* ---------- Formulario ---------- */
.formulario{
  max-width:820px;margin:34px auto 46px;padding:26px;
  background:var(--tarjeta);border:1px solid var(--linea);
  border-radius:var(--radio);box-shadow:var(--sombra);
}
.campo{margin-bottom:18px;display:flex;flex-direction:column;gap:6px}
.campo label{font-size:.86rem;font-weight:600;letter-spacing:.02em}
.campo input,.campo textarea,.campo select{
  font-family:inherit;font-size:16px;color:var(--tinta);
  padding:11px 13px;border:1px solid var(--linea);border-radius:9px;
  background:#fff;width:100%;
}
.campo textarea{resize:vertical;line-height:1.55}
.campo input:focus,.campo textarea:focus,.campo select:focus{
  outline:2px solid var(--tinta);outline-offset:1px;border-color:transparent;
}
.campos-fila{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.contador{margin:0;font-size:.8rem;color:var(--tinta-suave)}
.letra-chica{font-size:.82rem;color:var(--tinta-suave);margin:10px 0 0}
.aviso{
  margin:0 0 14px;padding:10px 12px;border-radius:9px;
  background:#F6E2DD;color:#6B2E22;font-size:.9rem;
}

.boton-principal{
  background:var(--tinta);color:var(--papel);border:0;border-radius:10px;
  padding:13px 22px;font-weight:600;min-height:46px;
}
.boton-principal:disabled{opacity:.55;cursor:default}
.boton-principal.grande{width:100%;margin-bottom:20px}
.boton-suave{
  background:transparent;color:var(--tinta);border:1px solid var(--linea);
  border-radius:10px;padding:11px 18px;min-height:44px;
}
.mini{
  background:none;border:0;padding:8px 6px;font-size:.82rem;
  color:var(--tinta-suave);text-decoration:underline;min-height:36px;
}
.mini.peligro{color:#8C4652}

.gracias{
  max-width:820px;margin:34px auto 40px;padding:20px 22px;text-align:center;
  background:var(--papel-hondo);border:1px solid var(--linea);border-radius:var(--radio);
  font-family:"Playfair Display",Georgia,serif;font-size:1.1rem;
}

/* ---------- Tarjetas ---------- */
.rejilla{
  display:grid;gap:18px;margin:0 0 8px;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
}
.tarjeta{
  background:var(--tarjeta);border:2px solid;border-radius:var(--radio);
  padding:20px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:12px;
}
.tarjeta-cabeza{display:flex;gap:12px;align-items:flex-start}
.avatar{
  width:46px;height:46px;flex:0 0 auto;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
}
.avatar .ico{width:28px;height:28px}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tarjeta-quien{min-width:0}
.tarjeta-nombre{margin:0;font-weight:600;font-size:1.02rem;line-height:1.3}
.tarjeta-rol{margin:1px 0 0;font-size:.86rem;color:var(--tinta-suave)}
.tarjeta-org{margin:0;font-size:.86rem;color:var(--tinta-suave)}
.tarjeta-texto{margin:0;white-space:pre-wrap;overflow-wrap:break-word}
.tarjeta-pie{
  margin-top:auto;padding-top:8px;border-top:1px solid var(--linea);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:.78rem;color:var(--tinta-suave);
}

.vacio{
  text-align:center;color:var(--tinta-suave);font-style:italic;
  padding:26px 10px;margin:0;
}

/* ---------- Divisor de ciclo ---------- */
.divisor{margin:52px 0 26px}
.divisor-filete{height:2px;background:var(--linea)}
.divisor-cuerpo{
  background:var(--papel-hondo);padding:24px 24px 20px;
}
.divisor-datos{
  display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap;margin-top:16px;
}
.plegar{
  background:none;border:0;padding:10px 0;min-height:44px;
  font-weight:600;font-size:.92rem;text-decoration:underline;color:var(--tinta);
}

/* ---------- Pie ---------- */
.pie{
  margin-top:56px;padding-top:22px;border-top:1px solid var(--linea);
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  color:var(--tinta-suave);font-size:.86rem;
}
.pie p{margin:0}
.engranaje{
  background:none;border:0;color:var(--linea);font-size:.8rem;
  min-width:44px;min-height:44px;border-radius:8px;
}
.engranaje:hover,.engranaje:focus-visible{color:var(--tinta-suave)}

/* ---------- Capas y panel ---------- */
.capa{
  position:fixed;inset:0;background:rgba(44,42,38,.45);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.modal{
  background:var(--tarjeta);border-radius:var(--radio);padding:26px;
  width:100%;max-width:420px;box-shadow:var(--sombra);
}
.modal h2{
  font-family:"Playfair Display",Georgia,serif;margin:0 0 8px;font-size:1.35rem;
}
.modal-texto{margin:0 0 16px;color:var(--tinta-suave);font-size:.94rem}
.modal input{
  width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--linea);
  border-radius:9px;margin-bottom:14px;letter-spacing:.3em;text-align:center;
}
.modal-botones{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.capa-panel{align-items:stretch;padding:0}
.panel{
  background:var(--papel);width:100%;max-width:100%;
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-cabeza{
  flex:0 0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:16px 20px;border-bottom:1px solid var(--linea);background:var(--tarjeta);
}
.panel-cabeza h2{font-family:"Playfair Display",Georgia,serif;margin:0;font-size:1.3rem}
.panel-cabeza div{display:flex;gap:8px;flex-wrap:wrap}
.pestanas{
  flex:0 0 auto;
  display:flex;align-items:center;gap:4px;overflow-x:auto;padding:10px 20px 14px;
  border-bottom:1px solid var(--linea);background:var(--tarjeta);
}
.pestana{
  background:none;border:0;padding:10px 14px;border-radius:9px;white-space:nowrap;
  font-size:.9rem;color:var(--tinta-suave);min-height:44px;
}
.pestana.activa{background:var(--papel-hondo);color:var(--tinta);font-weight:600}
.panel-cuerpo{flex:1 1 auto;min-height:0;padding:22px 20px 60px;overflow-y:auto;max-width:900px;width:100%;margin:0 auto}

.cajon,.ficha{
  background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);
  padding:20px;margin-bottom:20px;
}
.ficha-activa{border-color:var(--tinta)}
.ficha-estado,.cajon-aviso{
  margin:0 0 14px;font-size:.85rem;color:var(--tinta-suave);
}
.sub{
  font-family:"Bebas Neue",sans-serif;letter-spacing:.16em;text-transform:uppercase;
  font-size:1rem;margin:24px 0 8px;color:var(--tinta-suave);
}
.lista-peliculas{list-style:none;margin:0 0 14px;padding:0}
.lista-peliculas li{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--linea);font-size:.9rem;
}
.fila-admin{
  background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;
  padding:14px 16px;margin-bottom:12px;
}
.fila-quien{margin:0 0 4px;font-size:.9rem;color:var(--tinta-suave)}
.fila-estrellas{margin-left:8px}
.fila-texto{margin:0;font-size:.94rem;white-space:pre-wrap}
.fila-acciones{margin:6px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.mensaje-central{
  max-width:560px;margin:14vh auto;padding:0 24px;text-align:center;
}
.mensaje-central h1{
  font-family:"Playfair Display",Georgia,serif;font-size:1.6rem;margin:0 0 12px;
}
.cargando{color:var(--tinta-suave)}
code{background:var(--papel-hondo);padding:2px 6px;border-radius:5px;font-size:.9em}

/* ---------- Adaptación a pantallas ---------- */
@media (max-width:900px){
  .campos-fila{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .envoltura{padding:0 14px 46px}
  .encabezado{padding:32px 0 20px}
  .campos-fila{grid-template-columns:1fr}
  .rejilla{grid-template-columns:1fr}
  .formulario{padding:20px}
  .divisor-cuerpo{padding:20px 16px}
  .tarjeta{padding:16px}
}
</style>
</head>
<body>
  <div id="raiz"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>
  <script src="datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
